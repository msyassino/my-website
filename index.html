<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تطبيق المصاريف الشخصية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .sidebar-link:hover {
            background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%);
        }
        .sidebar-link.active {
            background: linear-gradient(90deg, rgba(59,130,246,0.2) 0%, transparent 100%);
            border-right: 3px solid #3b82f6;
        }
        .stat-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg fixed h-full z-10">
            <div class="p-6 border-b">
                <h1 class="text-2xl font-bold text-blue-600">
                    <i class="fas fa-wallet ml-2"></i>مصروفي
                </h1>
            </div>
            <nav class="mt-4">
                <a href="/" class="sidebar-link active flex items-center px-6 py-3 text-gray-700">
                    <i class="fas fa-home ml-3 w-5"></i>
                    <span>لوحة التحكم</span>
                </a>
                <a href="/add" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-plus-circle ml-3 w-5"></i>
                    <span>إضافة مصروف</span>
                </a>
                <a href="/expenses" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-list ml-3 w-5"></i>
                    <span>جميع المصاريف</span>
                </a>
                <a href="/statistics" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-chart-pie ml-3 w-5"></i>
                    <span>الإحصائيات</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 mr-64 p-8">
            <!-- Header -->
            <header class="mb-8 fade-in">
                <h2 class="text-3xl font-bold text-gray-800">لوحة التحكم</h2>
                <p class="text-gray-600 mt-1">نظرة عامة على مصاريفك</p>
            </header>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 fade-in">
                <div class="stat-card bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-100 text-sm">إجمالي المصاريف</p>
                            <p class="text-3xl font-bold mt-2" id="totalExpenses">0 ر.س</p>
                        </div>
                        <div class="bg-white/20 p-4 rounded-full">
                            <i class="fas fa-coins text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card bg-gradient-to-br from-green-500 to-green-600 rounded-2xl p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-green-100 text-sm">عدد المصاريف</p>
                            <p class="text-3xl font-bold mt-2" id="totalCount">0</p>
                        </div>
                        <div class="bg-white/20 p-4 rounded-full">
                            <i class="fas fa-receipt text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-100 text-sm">متوسط المصروف</p>
                            <p class="text-3xl font-bold mt-2" id="avgExpense">0 ر.س</p>
                        </div>
                        <div class="bg-white/20 p-4 rounded-full">
                            <i class="fas fa-calculator text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card bg-gradient-to-br from-orange-500 to-orange-600 rounded-2xl p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-orange-100 text-sm">آخر تحديث</p>
                            <p class="text-lg font-bold mt-2" id="lastUpdate">--</p>
                        </div>
                        <div class="bg-white/20 p-4 rounded-full">
                            <i class="fas fa-clock text-2xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8 fade-in">
                <!-- Category Chart -->
                <div class="bg-white rounded-2xl shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-pie ml-2 text-blue-500"></i>توزيع المصاريف حسب الفئة
                    </h3>
                    <canvas id="categoryChart" height="250"></canvas>
                </div>

                <!-- Monthly Chart -->
                <div class="bg-white rounded-2xl shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-bar ml-2 text-green-500"></i>المصاريف الشهرية
                    </h3>
                    <canvas id="monthlyChart" height="250"></canvas>
                </div>
            </div>

            <!-- Recent Expenses -->
            <div class="bg-white rounded-2xl shadow-md p-6 fade-in">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-gray-800">
                        <i class="fas fa-history ml-2 text-purple-500"></i>آخر المصاريف
                    </h3>
                    <a href="/expenses" class="text-blue-500 hover:text-blue-700 text-sm font-medium">
                        عرض الكل <i class="fas fa-arrow-left mr-1"></i>
                    </a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b">
                                <th class="text-right py-3 px-4 text-gray-600 font-medium">#</th>
                                <th class="text-right py-3 px-4 text-gray-600 font-medium">العنوان</th>
                                <th class="text-right py-3 px-4 text-gray-600 font-medium">الفئة</th>
                                <th class="text-right py-3 px-4 text-gray-600 font-medium">التاريخ</th>
                                <th class="text-left py-3 px-4 text-gray-600 font-medium">المبلغ</th>
                            </tr>
                        </thead>
                        <tbody id="recentExpensesTable">
                            <!-- Will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="mt-8 text-center fade-in">
                <a href="/add" class="inline-flex items-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                    <i class="fas fa-plus ml-2"></i>
                    إضافة مصروف جديد
                </a>
            </div>
        </main>
    </div>

    <script>
        let categoryChartInstance = null;
        let monthlyChartInstance = null;

        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                // Update stats
                document.getElementById('totalExpenses').textContent = data.total_expenses.toFixed(2) + ' ر.س';
                document.getElementById('totalCount').textContent = data.total_count;
                document.getElementById('avgExpense').textContent = (data.total_count > 0 ? (data.total_expenses / data.total_count).toFixed(2) : '0') + ' ر.س';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar-SA');
                
                // Update recent expenses table
                const tbody = document.getElementById('recentExpensesTable');
                tbody.innerHTML = '';
                data.recent_expenses.forEach((expense, index) => {
                    const row = `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="py-3 px-4">${index + 1}</td>
                            <td class="py-3 px-4 font-medium">${expense.title}</td>
                            <td class="py-3 px-4">
                                <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                                    ${getCategoryIcon(expense.category)} ${expense.category}
                                </span>
                            </td>
                            <td class="py-3 px-4 text-gray-600">${expense.expense_date}</td>
                            <td class="py-3 px-4 font-bold text-red-600">${expense.amount.toFixed(2)} ر.س</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                
                // Update charts
                updateCharts(data);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function getCategoryIcon(category) {
            const icons = {
                'طعام': '🍔',
                'مواصلات': '🚗',
                'ترفيه': '🎬',
                'صحة': '💊',
                'تعليم': '📚',
                'ملابس': '👕',
                'أخرى': '📦'
            };
            return icons[category] || '📝';
        }

        function updateCharts(data) {
            // Category Chart
            const categoryCtx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChartInstance) {
                categoryChartInstance.destroy();
            }
            
            const categories = data.categories.map(c => c.category);
            const totals = data.categories.map(c => c.total);
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6b7280'];
            
            categoryChartInstance = new Chart(categoryCtx, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        data: totals,
                        backgroundColor: colors.slice(0, categories.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            rtl: true,
                            labels: {
                                font: { family: 'Tajawal' },
                                padding: 15
                            }
                        }
                    }
                }
            });
            
            // Monthly Chart
            const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
            
            if (monthlyChartInstance) {
                monthlyChartInstance.destroy();
            }
            
            const months = data.months.map(m => m.month).reverse();
            const monthTotals = data.months.map(m => m.total).reverse();
            
            monthlyChartInstance = new Chart(monthlyCtx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'المبلغ (ر.س)',
                        data: monthTotals,
                        backgroundColor: 'rgba(59, 130, 246, 0.7)',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        // Load dashboard on page load
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
