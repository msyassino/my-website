<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع المصاريف - تطبيق المصاريف الشخصية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .sidebar-link:hover { background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%); }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.2) 0%, transparent 100%); border-right: 3px solid #3b82f6; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white shadow-lg fixed h-full z-10">
            <div class="p-6 border-b"><h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-wallet ml-2"></i>مصروفي</h1></div>
            <nav class="mt-4">
                <a href="/" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-home ml-3 w-5"></i><span>لوحة التحكم</span></a>
                <a href="/add" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-plus-circle ml-3 w-5"></i><span>إضافة مصروف</span></a>
                <a href="/expenses" class="sidebar-link active flex items-center px-6 py-3 text-gray-700"><i class="fas fa-list ml-3 w-5"></i><span>جميع المصاريف</span></a>
                <a href="/statistics" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-chart-pie ml-3 w-5"></i><span>الإحصائيات</span></a>
            </nav>
        </aside>

        <main class="flex-1 mr-64 p-8">
            <header class="mb-8 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-3xl font-bold text-gray-800">جميع المصاريف</h2>
                        <p class="text-gray-600 mt-1">قائمة كاملة بجميع المصاريف المسجلة</p>
                    </div>
                    <a href="/add" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
                        <i class="fas fa-plus ml-2"></i>إضافة جديد
                    </a>
                </div>
            </header>

            <!-- Filters -->
            <div class="bg-white rounded-2xl shadow-md p-6 mb-6 fade-in">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="searchInput" placeholder="🔍 بحث بالعنوان..." 
                        class="px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="categoryFilter" 
                        class="px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">كل الفئات</option>
                        <option value="طعام">طعام</option>
                        <option value="مواصلات">مواصلات</option>
                        <option value="ترفيه">ترفيه</option>
                        <option value="صحة">صحة</option>
                        <option value="تعليم">تعليم</option>
                        <option value="ملابس">ملابس</option>
                        <option value="منزل">منزل</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                    <input type="date" id="dateFrom" 
                        class="px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="applyFilters()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition">
                        <i class="fas fa-filter ml-2"></i>تطبيق الفلتر
                    </button>
                </div>
            </div>

            <!-- Expenses Table -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden fade-in">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="text-right py-4 px-6 text-gray-600 font-medium">#</th>
                                <th class="text-right py-4 px-6 text-gray-600 font-medium">العنوان</th>
                                <th class="text-right py-4 px-6 text-gray-600 font-medium">الفئة</th>
                                <th class="text-right py-4 px-6 text-gray-600 font-medium">التاريخ</th>
                                <th class="text-left py-4 px-6 text-gray-600 font-medium">المبلغ</th>
                                <th class="text-center py-4 px-6 text-gray-600 font-medium">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTable" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
                <div id="noExpenses" class="hidden p-8 text-center text-gray-500">
                    <i class="fas fa-inbox text-4xl mb-4"></i>
                    <p>لا توجد مصاريف مسجلة</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-6">تعديل المصروف</h3>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editId">
                <input type="text" id="editTitle" required class="w-full px-4 py-3 border rounded-xl">
                <input type="number" id="editAmount" step="0.01" required class="w-full px-4 py-3 border rounded-xl">
                <select id="editCategory" required class="w-full px-4 py-3 border rounded-xl">
                    <option value="طعام">طعام</option>
                    <option value="مواصلات">مواصلات</option>
                    <option value="ترفيه">ترفيه</option>
                    <option value="صحة">صحة</option>
                    <option value="تعليم">تعليم</option>
                    <option value="ملابس">ملابس</option>
                    <option value="منزل">منزل</option>
                    <option value="أخرى">أخرى</option>
                </select>
                <input type="date" id="editDate" required class="w-full px-4 py-3 border rounded-xl">
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">حفظ</button>
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allExpenses = [];

        async function loadExpenses() {
            try {
                const response = await fetch('/expenses/');
                allExpenses = await response.json();
                renderExpenses(allExpenses);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderExpenses(expenses) {
            const tbody = document.getElementById('expensesTable');
            const noData = document.getElementById('noExpenses');
            
            if (expenses.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('hidden');
                return;
            }
            
            noData.classList.add('hidden');
            tbody.innerHTML = expenses.map((e, i) => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="py-4 px-6">${i + 1}</td>
                    <td class="py-4 px-6 font-medium">${e.title}</td>
                    <td class="py-4 px-6"><span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">${getIcon(e.category)} ${e.category}</span></td>
                    <td class="py-4 px-6 text-gray-600">${e.expense_date}</td>
                    <td class="py-4 px-6 font-bold text-red-600">${e.amount.toFixed(2)} ر.س</td>
                    <td class="py-4 px-6">
                        <button onclick="openEditModal(${e.id})" class="text-blue-500 hover:text-blue-700 mx-1"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteExpense(${e.id})" class="text-red-500 hover:text-red-700 mx-1"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getIcon(cat) {
            const icons = {'طعام':'🍔','مواصلات':'🚗','ترفيه':'🎬','صحة':'💊','تعليم':'📚','ملابس':'👕','منزل':'🏠','أخرى':'📦'};
            return icons[cat] || '📝';
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            
            let filtered = allExpenses.filter(e => {
                if (search && !e.title.toLowerCase().includes(search)) return false;
                if (category && e.category !== category) return false;
                if (dateFrom && e.expense_date < dateFrom) return false;
                return true;
            });
            renderExpenses(filtered);
        }

        async function deleteExpense(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            try {
                await fetch(`/expenses/${id}`, { method: 'DELETE' });
                loadExpenses();
            } catch (error) {
                alert('خطأ في الحذف');
            }
        }

        function openEditModal(id) {
            const expense = allExpenses.find(e => e.id === id);
            if (!expense) return;
            document.getElementById('editId').value = expense.id;
            document.getElementById('editTitle').value = expense.title;
            document.getElementById('editAmount').value = expense.amount;
            document.getElementById('editCategory').value = expense.category;
            document.getElementById('editDate').value = expense.expense_date;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                title: document.getElementById('editTitle').value,
                amount: parseFloat(document.getElementById('editAmount').value),
                category: document.getElementById('editCategory').value,
                expense_date: document.getElementById('editDate').value
            };
            try {
                await fetch(`/expenses/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                closeEditModal();
                loadExpenses();
            } catch (error) {
                alert('خطأ في التعديل');
            }
        });

        loadExpenses();
    </script>
</body>
</html>
