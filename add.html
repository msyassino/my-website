<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مصروف - تطبيق المصاريف الشخصية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .sidebar-link:hover { background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%); }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.2) 0%, transparent 100%); border-right: 3px solid #3b82f6; }
        .form-input:focus { ring: 2px; ring-color: #3b82f6; border-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg fixed h-full z-10">
            <div class="p-6 border-b">
                <h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-wallet ml-2"></i>مصروفي</h1>
            </div>
            <nav class="mt-4">
                <a href="/" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-home ml-3 w-5"></i><span>لوحة التحكم</span></a>
                <a href="/add" class="sidebar-link active flex items-center px-6 py-3 text-gray-700"><i class="fas fa-plus-circle ml-3 w-5"></i><span>إضافة مصروف</span></a>
                <a href="/expenses" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-list ml-3 w-5"></i><span>جميع المصاريف</span></a>
                <a href="/statistics" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-chart-pie ml-3 w-5"></i><span>الإحصائيات</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 mr-64 p-8">
            <header class="mb-8 fade-in">
                <h2 class="text-3xl font-bold text-gray-800">إضافة مصروف جديد</h2>
                <p class="text-gray-600 mt-1">أدخل تفاصيل المصروف الجديد</p>
            </header>

            <div class="max-w-2xl fade-in">
                <div class="bg-white rounded-2xl shadow-md p-8">
                    <form id="expenseForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">العنوان</label>
                            <input type="text" id="title" required maxlength="100" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="مثال: غداء، وقود، تسوق...">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">المبلغ (ر.س)</label>
                                <input type="number" id="amount" step="0.01" min="0.01" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                    placeholder="0.00">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">الفئة</label>
                                <select id="category" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                    <option value="">اختر الفئة...</option>
                                    <option value="طعام">🍔 طعام</option>
                                    <option value="مواصلات">🚗 مواصلات</option>
                                    <option value="ترفيه">🎬 ترفيه</option>
                                    <option value="صحة">💊 صحة</option>
                                    <option value="تعليم">📚 تعليم</option>
                                    <option value="ملابس">👕 ملابس</option>
                                    <option value="منزل">🏠 منزل</option>
                                    <option value="أخرى">📦 أخرى</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">التاريخ</label>
                            <input type="date" id="expense_date" required 
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button type="submit" 
                                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition transform hover:scale-[1.02]">
                                <i class="fas fa-plus ml-2"></i>إضافة المصروف
                            </button>
                            <a href="/" class="px-6 py-4 border border-gray-300 text-gray-700 font-medium rounded-xl hover:bg-gray-50 transition text-center">
                                إلغاء
                            </a>
                        </div>
                    </form>

                    <div id="message" class="hidden mt-6 p-4 rounded-xl"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('expense_date').valueAsDate = new Date();

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const expense = {
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                expense_date: document.getElementById('expense_date').value
            };
            
            try {
                const response = await fetch('/expenses/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(expense)
                });
                
                if (response.ok) {
                    showMessage('تم إضافة المصروف بنجاح! ✅', 'success');
                    document.getElementById('expenseForm').reset();
                    document.getElementById('expense_date').valueAsDate = new Date();
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    const error = await response.json();
                    showMessage('خطأ: ' + error.detail, 'error');
                }
            } catch (error) {
                showMessage('خطأ في الاتصال بالخادم', 'error');
            }
        });

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.className = 'p-4 rounded-xl ' + (type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800');
            msgDiv.innerHTML = '<i class="fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle') + ' ml-2"></i>' + text;
            msgDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
