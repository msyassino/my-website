<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإحصائيات - تطبيق المصاريف الشخصية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .sidebar-link:hover { background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%); }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.2) 0%, transparent 100%); border-right: 3px solid #3b82f6; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white shadow-lg fixed h-full z-10">
            <div class="p-6 border-b"><h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-wallet ml-2"></i>مصروفي</h1></div>
            <nav class="mt-4">
                <a href="/" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-home ml-3 w-5"></i><span>لوحة التحكم</span></a>
                <a href="/add" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-plus-circle ml-3 w-5"></i><span>إضافة مصروف</span></a>
                <a href="/expenses" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition"><i class="fas fa-list ml-3 w-5"></i><span>جميع المصاريف</span></a>
                <a href="/statistics" class="sidebar-link active flex items-center px-6 py-3 text-gray-700"><i class="fas fa-chart-pie ml-3 w-5"></i><span>الإحصائيات</span></a>
            </nav>
        </aside>

        <main class="flex-1 mr-64 p-8">
            <header class="mb-8 fade-in">
                <h2 class="text-3xl font-bold text-gray-800">الإحصائيات والتحليلات</h2>
                <p class="text-gray-600 mt-1">تحليل شامل لمصاريفك</p>
            </header>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 fade-in">
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white">
                    <p class="text-blue-100">إجمالي المصاريف</p>
                    <p class="text-3xl font-bold mt-2" id="totalAmount">0 ر.س</p>
                </div>
                <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-2xl p-6 text-white">
                    <p class="text-green-100">عدد الفئات</p>
                    <p class="text-3xl font-bold mt-2" id="categoryCount">0</p>
                </div>
                <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl p-6 text-white">
                    <p class="text-purple-100">متوسط المصروف</p>
                    <p class="text-3xl font-bold mt-2" id="avgAmount">0 ر.س</p>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8 fade-in">
                <div class="bg-white rounded-2xl shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-chart-pie ml-2 text-blue-500"></i>توزيع الفئات</h3>
                    <canvas id="pieChart" height="300"></canvas>
                </div>
                <div class="bg-white rounded-2xl shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-chart-bar ml-2 text-green-500"></i>المقارنة بين الفئات</h3>
                    <canvas id="barChart" height="300"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 mb-8 fade-in">
                <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-calendar-alt ml-2 text-orange-500"></i>المصاريف الشهرية</h3>
                <canvas id="lineChart" height="150"></canvas>
            </div>

            <!-- Category Details -->
            <div class="bg-white rounded-2xl shadow-md p-6 fade-in">
                <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-list ml-2 text-purple-500"></i>التفاصيل حسب الفئة</h3>
                <div id="categoryDetails" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <script>
        let pieChart, barChart, lineChart;

        async function loadStatistics() {
            try {
                const [catRes, monthRes, dashRes] = await Promise.all([
                    fetch('/expenses/category/total'),
                    fetch('/expenses/month/total'),
                    fetch('/api/dashboard')
                ]);
                
                const categories = await catRes.json();
                const months = await monthRes.json();
                const dashboard = await dashRes.json();

                // Update summary cards
                document.getElementById('totalAmount').textContent = dashboard.total_expenses.toFixed(2) + ' ر.س';
                document.getElementById('categoryCount').textContent = categories.length;
                document.getElementById('avgAmount').textContent = (dashboard.total_count > 0 ? (dashboard.total_expenses / dashboard.total_count).toFixed(2) : '0') + ' ر.س';

                // Pie Chart
                const pieCtx = document.getElementById('pieChart').getContext('2d');
                if (pieChart) pieChart.destroy();
                pieChart = new Chart(pieCtx, {
                    type: 'doughnut',
                    data: {
                        labels: categories.map(c => c.category),
                        datasets: [{
                            data: categories.map(c => c.total),
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6b7280', '#14b8a6'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Tajawal' }, padding: 15 } } } }
                });

                // Bar Chart
                const barCtx = document.getElementById('barChart').getContext('2d');
                if (barChart) barChart.destroy();
                barChart = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: categories.map(c => c.category),
                        datasets: [{
                            label: 'المبلغ (ر.س)',
                            data: categories.map(c => c.total),
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6b7280', '#14b8a6'],
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } } }
                });

                // Line Chart
                const lineCtx = document.getElementById('lineChart').getContext('2d');
                if (lineChart) lineChart.destroy();
                const reversedMonths = [...months].reverse();
                lineChart = new Chart(lineCtx, {
                    type: 'line',
                    data: {
                        labels: reversedMonths.map(m => m.month),
                        datasets: [{
                            label: 'المصاريف الشهرية',
                            data: reversedMonths.map(m => m.total),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 6,
                            pointBackgroundColor: '#3b82f6'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } } }
                });

                // Category Details
                const detailsDiv = document.getElementById('categoryDetails');
                detailsDiv.innerHTML = categories.map(c => `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${getIcon(c.category)}</span>
                            <div>
                                <p class="font-bold text-gray-800">${c.category}</p>
                                <p class="text-sm text-gray-500">${c.percentage.toFixed(1)}% من الإجمالي</p>
                            </div>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-blue-600 text-lg">${c.total.toFixed(2)} ر.س</p>
                            <div class="w-32 h-2 bg-gray-200 rounded-full mt-1 overflow-hidden">
                                <div class="h-full bg-blue-500 rounded-full" style="width: ${c.percentage}%"></div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error:', error);
            }
        }

        function getIcon(cat) {
            const icons = {'طعام':'🍔','مواصلات':'🚗','ترفيه':'🎬','صحة':'💊','تعليم':'📚','ملابس':'👕','منزل':'🏠','أخرى':'📦'};
            return icons[cat] || '📝';
        }

        document.addEventListener('DOMContentLoaded', loadStatistics);
    </script>
</body>
</html>
